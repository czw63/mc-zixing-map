<svg aria-hidden="true" focusable="false" width="0" height="0" xmlns="http://www.w3.org/2000/svg">
  <filter id="liquid-glass-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.008"
      numOctaves="2"
      seed="7"
      result="noise"
    >
      <animate
        attributeName="baseFrequency"
        dur="7s"
        values="0.008;0.0132;0.008"
        repeatCount="indefinite"
      />
    </feTurbulence>
    <feDisplacementMap
      in="SourceGraphic"
      in2="noise"
      scale="18"
      xChannelSelector="R"
      yChannelSelector="G"
    />
  </filter>
</svg>
